name: Check firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out userspace
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.12.19"

      - name: Set up dependencies
        run: make setup

      - name: Compile and render
        run: make check

      - name: Upload firmware and printable layout
        uses: actions/upload-artifact@v7.0.1
        with:
          name: voyager-firmware-and-layout
          path: |
            artifacts/*.bin
            artifacts/*.hex
            artifacts/*.uf2
            artifacts/layout.svg
          if-no-files-found: error
